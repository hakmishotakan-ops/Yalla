<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aylla 💖</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: black;
    color: white;
    overflow: hidden;
    text-align: center;
}

/* tela inicial */
#start {
    position: absolute;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5rem;
    z-index: 10;
}

/* conteúdo */
.container {
    display: none;
    padding: 20px;
    position: relative;
    top: 50%;
    transform: translateY(-50%);
}

/* texto digitando */
#texto {
    font-size: 1.3rem;
    min-height: 100px;
}

/* botões */
button {
    margin: 10px;
    padding: 15px 25px;
    font-size: 1.1rem;
    border-radius: 30px;
    border: none;
}

#sim {
    background: white;
    color: #ff4e88;
}

#nao {
    background: transparent;
    border: 2px solid white;
    color: white;
    position: absolute;
}

/* corações */
.heart {
    position: absolute;
    bottom: -20px;
    font-size: 20px;
    animation: subir 6s linear infinite;
}

@keyframes subir {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>

<body>

<div id="start" onclick="iniciar()">
    ▶️ Tocar
</div>

<div class="container" id="conteudo">

    <div id="texto"></div>

    <div id="botoes" style="display:none;">
        <h2>Minha gata... 💖</h2>
        <p>Você aceita namorar comigo?</p>

        <button id="sim" onclick="aceitar()">Sim ❤️</button>
        <button id="nao" ontouchstart="fugir()" onmouseover="fugir()">Não 😅</button>

        <a href="https://www.youtube.com/results?search_query=Is+This+Love" target="_blank" style="display:block;margin-top:20px;color:white;">
            🎵 Is This Love
        </a>
    </div>

</div>

<script>
const frases = [
"Aylla...",
"Eu não sei exatamente quando tudo mudou...",
"mas de alguma forma...",
"você virou algo muito importante pra mim.",
"Você trouxe leveza...",
"sorrisos que eu nem sabia que precisava...",
"e momentos que eu queria repetir pra sempre.",
"",
"E agora eu só tenho uma pergunta..."
];

let i = 0;
let j = 0;

function iniciar() {
    document.getElementById("start").style.display = "none";
    document.getElementById("conteudo").style.display = "block";
    digitar();
}

function digitar() {
    if (i < frases.length) {
        if (j < frases[i].length) {
            document.getElementById("texto").innerHTML += frases[i].charAt(j);
            j++;
            setTimeout(digitar, 40);
        } else {
            document.getElementById("texto").innerHTML += "<br><br>";
            i++;
            j = 0;
            setTimeout(digitar, 600);
        }
    } else {
        document.getElementById("botoes").style.display = "block";
    }
}

function aceitar() {
    document.body.innerHTML = "<h1 style='margin-top:40vh;'>Agora é oficial ❤️<br>Eu te quero pra sempre, minha gata.</h1>";

    setInterval(() => {
        let heart = document.createElement("div");
        heart.innerHTML = "💖";
        heart.className = "heart";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random()*25+15)+"px";
        document.body.appendChild(heart);
    }, 200);
}

function fugir() {
    const botao = document.getElementById("nao");
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    botao.style.left = x + "px";
    botao.style.top = y + "px";
}
</script>

</body>
</html>
