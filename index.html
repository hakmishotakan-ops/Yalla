<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pra você, Aylla 💖</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    overflow: hidden;
    color: white;
    text-align: center;
}

.container {
    position: relative;
    top: 50%;
    transform: translateY(-50%);
    padding: 20px;
    animation: fadeIn 2s ease;
}

h1 {
    font-size: 2rem;
}

p {
    font-size: 1.2rem;
    margin-top: 10px;
}

button {
    margin-top: 20px;
    padding: 15px 25px;
    font-size: 1.1rem;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
}

#sim {
    background: white;
    color: #ff4e88;
}

#nao {
    background: transparent;
    border: 2px solid white;
    color: white;
    position: absolute;
}

#resposta {
    margin-top: 20px;
    font-size: 1.4rem;
}

.music {
    margin-top: 20px;
    display: block;
    color: white;
    text-decoration: underline;
}

.heart {
    position: absolute;
    bottom: -10px;
    color: white;
    font-size: 20px;
    animation: subir 5s linear infinite;
}

@keyframes subir {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100vh); opacity: 0; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px);}
    to { opacity: 1; transform: translateY(-50%);}
}
</style>
</head>

<body>

<div class="container">
    <h1>Aylla...</h1>
    <p>Desde que você entrou na minha vida,</p>
    <p>tudo ficou mais leve, mais bonito...</p>
    <p>e mais verdadeiro.</p>

    <h2>Minha gata... 💖</h2>
    <p>Você aceita namorar comigo?</p>

    <button id="sim" onclick="aceitar()">Sim ❤️</button>
    <button id="nao" onmouseover="fugir()">Não 😅</button>

    <div id="resposta"></div>

    <a class="music" href="https://www.youtube.com/results?search_query=Is+This+Love" target="_blank">
        🎵 Nossa música (clica aqui)
    </a>
</div>

<script>
function aceitar() {
    document.getElementById("resposta").innerHTML = "Agora é oficial ❤️ Eu te quero pra sempre, minha gata.";
}

function fugir() {
    const botao = document.getElementById("nao");
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    botao.style.left = x + "px";
    botao.style.top = y + "px";
}

// corações subindo
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}, 300);
</script>

</body>
</html>
