<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aylla 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
* {margin:0;padding:0;box-sizing:border-box;}

body {
    font-family: 'Inter', sans-serif;
    height:100vh;
    overflow:hidden;
    background: linear-gradient(135deg,#1a001f,#000);
    color:white;
}

/* fundo com partículas suaves */
canvas {
    position:fixed;
    top:0;left:0;
    z-index:0;
}

/* container */
.screen {
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:30px;
    transition:0.6s ease;
    z-index:2;
}

.hidden {
    opacity:0;
    transform:scale(1.05);
    pointer-events:none;
}

h1 {
    font-family:'Playfair Display', serif;
    font-size:2.2rem;
    margin-bottom:15px;
}

p {
    font-size:1.2rem;
    opacity:0.85;
    max-width:320px;
}

/* botão */
.btn {
    margin-top:25px;
    padding:14px 28px;
    border-radius:40px;
    border:none;
    font-size:1rem;
    cursor:pointer;
    background: linear-gradient(45deg,#ff4e88,#ff7eb3);
    color:white;
    box-shadow:0 10px 25px rgba(255,0,100,0.3);
    transition:0.2s;
}

.btn:active {
    transform:scale(0.95);
}

/* botão fugir */
#nao {
    position:absolute;
    background:transparent;
    border:2px solid white;
}

/* link música */
.music {
    margin-top:20px;
    font-size:0.9rem;
    color:white;
    opacity:0.7;
}

/* corações */
.heart {
    position:absolute;
    bottom:-10px;
    font-size:20px;
    animation:rise 6s linear infinite;
}

@keyframes rise {
    to { transform:translateY(-110vh); opacity:0; }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<!-- TELAS -->
<div class="screen" id="t1">
    <h1>Aylla...</h1>
    <p>eu fiz isso pra você</p>
    <button class="btn" onclick="next()">Começar</button>
</div>

<div class="screen hidden" id="t2">
    <p>Tem coisas que a gente não explica...</p>
    <button class="btn" onclick="next()">Continuar</button>
</div>

<div class="screen hidden" id="t3">
    <p>só sente.</p>
    <button class="btn" onclick="next()">Continuar</button>
</div>

<div class="screen hidden" id="t4">
    <p>E de alguma forma...</p>
    <button class="btn" onclick="next()">Continuar</button>
</div>

<div class="screen hidden" id="t5">
    <p>você virou algo muito especial pra mim.</p>
    <button class="btn" onclick="next()">Continuar</button>
</div>

<div class="screen hidden" id="t6">
    <p>E eu não quero mais imaginar meus dias sem você.</p>
    <button class="btn" onclick="next()">Continuar</button>
</div>

<div class="screen hidden" id="t7">
    <h1>Minha gata 💖</h1>
    <p>Você aceita namorar comigo?</p>

    <button class="btn" onclick="aceitar()">Sim ❤️</button>
    <button id="nao" class="btn" ontouchstart="fugir()" onmouseover="fugir()">Não 😅</button>

    <a class="music" href="https://www.youtube.com/results?search_query=Is+This+Love" target="_blank">
        🎵 Is This Love
    </a>
</div>

<script>
/* fluxo correto */
let atual = 1;
const total = 7;

function next(){
    document.getElementById("t"+atual).classList.add("hidden");
    atual++;
    if(atual <= total){
        document.getElementById("t"+atual).classList.remove("hidden");
    }
}

/* botão fugir */
function fugir(){
    const b = document.getElementById("nao");
    b.style.left = Math.random()*(window.innerWidth-100)+"px";
    b.style.top = Math.random()*(window.innerHeight-50)+"px";
}

/* aceitar */
function aceitar(){
    document.body.innerHTML = "<h1 style='margin-top:40vh;text-align:center;'>Agora é oficial ❤️<br>Eu te quero pra sempre.</h1>";

    setInterval(()=>{
        let h=document.createElement("div");
        h.className="heart";
        h.innerHTML="💖";
        h.style.left=Math.random()*100+"vw";
        document.body.appendChild(h);
    },200);
}

/* fundo partículas */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i=0;i<60;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";

    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();

        p.y -= 0.2;
        if(p.y<0) p.y = canvas.height;
    });

    requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
