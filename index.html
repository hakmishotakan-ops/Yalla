<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aylla 💖</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at center, #1a001f, #000);
    color: white;
    overflow: hidden;
    text-align: center;
}

/* fundo com partículas */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
}

/* tela inicial */
#start {
    position: absolute;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5rem;
    z-index: 10;
    letter-spacing: 2px;
}

/* conteúdo */
.container {
    position: relative;
    z-index: 2;
    top: 50%;
    transform: translateY(-50%);
    padding: 20px;
    display: none;
}

/* texto */
#texto {
    font-size: 1.3rem;
    line-height: 1.6;
}

/* botões */
button {
    margin: 10px;
    padding: 15px 25px;
    font-size: 1.1rem;
    border-radius: 30px;
    border: none;
}

#sim {
    background: linear-gradient(45deg, #ff4e88, #ff7eb3);
    color: white;
}

#nao {
    background: transparent;
    border: 2px solid white;
    color: white;
    position: absolute;
}

/* corações */
.heart {
    position: absolute;
    bottom: -20px;
    font-size: 20px;
    animation: subir 6s linear infinite;
}

@keyframes subir {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div id="start" onclick="iniciar()">
    ▶️ TOCAR
</div>

<div class="container" id="conteudo">

    <div id="texto"></div>

    <div id="botoes" style="display:none;">
        <h2>Minha gata... 💖</h2>
        <p>Você aceita namorar comigo?</p>

        <button id="sim" onclick="aceitar()">Sim ❤️</button>
        <button id="nao" ontouchstart="fugir()" onmouseover="fugir()">Não 😅</button>

        <a href="https://www.youtube.com/results?search_query=Is+This+Love" target="_blank" style="display:block;margin-top:20px;color:white;">
            🎵 Is This Love
        </a>
    </div>

</div>

<script>
// partículas no fundo
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "white";

    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();

        p.y -= 0.2;
        if (p.y < 0) p.y = canvas.height;
    });

    requestAnimationFrame(draw);
}
draw();

// texto digitando
const frases = [
"Aylla...",
"Tem coisa que a gente não explica...",
"só sente.",
"E de alguma forma...",
"você virou algo especial pra mim.",
"",
"Então eu só preciso te perguntar..."
];

let i = 0, j = 0;

function iniciar() {
    document.getElementById("start").style.display = "none";
    document.getElementById("conteudo").style.display = "block";
    digitar();
}

function digitar() {
    if (i < frases.length) {
        if (j < frases[i].length) {
            document.getElementById("texto").innerHTML += frases[i][j];
            j++;
            setTimeout(digitar, 40);
        } else {
            document.getElementById("texto").innerHTML += "<br><br>";
            i++; j = 0;
            setTimeout(digitar, 600);
        }
    } else {
        document.getElementById("botoes").style.display = "block";
    }
}

function aceitar() {
    document.body.innerHTML = "<h1 style='margin-top:40vh;'>Agora é oficial ❤️<br>Eu te quero pra sempre.</h1>";

    setInterval(() => {
        let heart = document.createElement("div");
        heart.innerHTML = "💖";
        heart.className = "heart";
        heart.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(heart);
    }, 200);
}

function fugir() {
    const b = document.getElementById("nao");
    b.style.left = Math.random() * (window.innerWidth - 100) + "px";
    b.style.top = Math.random() * (window.innerHeight - 50) + "px";
}
</script>

</body>
</html>
